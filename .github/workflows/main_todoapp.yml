name: Build, Test and Deploy — Todoapp

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'microsoft'

      - name: Run Tests
        run: mvn test

      - name: Build JAR (skip tests since already ran)
        run: mvn package -DskipTests

      - name: Confirm JAR exists
        run: |
          ls -lh target/
          test -f target/todo-app.jar && echo "✅ JAR FOUND" || (echo "❌ JAR MISSING" && exit 1)

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_2B45D5AF57794C238501BBF53B656FE7 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_238F392DF2A74BAF9C37522BD1B0243D }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_A0E56221979B41F5844D2B8560461031 }}

      - name: Deploy JAR to Azure
        run: |
          az webapp deploy \
            --name Todoapp \
            --resource-group Todoapp_group \
            --src-path target/todo-app.jar \
            --type jar \
            --async true \
            --timeout 30 || true
