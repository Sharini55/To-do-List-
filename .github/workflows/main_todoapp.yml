name: Build and deploy JAR app to Azure Web App - Todoapp
 
on:
  push:
    branches:
      - main
  workflow_dispatch:
 
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
 
    steps:
      - uses: actions/checkout@v4
 
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'microsoft'
 
      - name: Build with Maven
        run: mvn clean package -DskipTests
 
      - name: Confirm JAR exists
        run: |
          ls -lh target/
          test -f target/todo-app.jar && echo "JAR FOUND" || (echo "JAR MISSING - BUILD FAILED" && exit 1)
 
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_2B45D5AF57794C238501BBF53B656FE7 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_238F392DF2A74BAF9C37522BD1B0243D }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_A0E56221979B41F5844D2B8560461031 }}
 
      - name: Stop App Service before deploy
        run: az webapp stop --name Todoapp --resource-group $(az webapp show --name Todoapp --query resourceGroup -o tsv)
 
      - name: Deploy JAR via Azure CLI
        run: |
          RESOURCE_GROUP=$(az webapp show --name Todoapp --query resourceGroup -o tsv)
          echo "Deploying to resource group: $RESOURCE_GROUP"
          az webapp deploy \
            --name Todoapp \
            --resource-group $RESOURCE_GROUP \
            --src-path target/todo-app.jar \
            --type jar \
            --async false
 
      - name: Start App Service after deploy
        run: az webapp start --name Todoapp --resource-group $(az webapp show --name Todoapp --query resourceGroup -o tsv)
 
