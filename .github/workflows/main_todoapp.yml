name: Build and deploy JAR app to Azure Web App - Todoapp
 
on:
  push:
    branches:
      - main
  workflow_dispatch:
 
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
 
    steps:
      - uses: actions/checkout@v4
 
      - name: Set up Java version
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'microsoft'
 
      - name: Build with Maven
        run: mvn clean package -DskipTests
 
      - name: Verify JAR was created
        run: |
          echo "=== Files in target/ ==="
          ls -la target/
          echo "=== Checking todo-app.jar exists ==="
          test -f target/todo-app.jar && echo "SUCCESS: todo-app.jar found" || echo "FAILED: todo-app.jar NOT found"
 
      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: java-app
          path: target/todo-app.jar
 
  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read
 
    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: java-app
          path: .
 
      - name: Verify downloaded JAR
        run: |
          echo "=== Downloaded files ==="
          ls -la
          test -f todo-app.jar && echo "SUCCESS: todo-app.jar ready to deploy" || echo "FAILED: todo-app.jar missing"
 
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_2B45D5AF57794C238501BBF53B656FE7 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_238F392DF2A74BAF9C37522BD1B0243D }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_A0E56221979B41F5844D2B8560461031 }}
 
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'Todoapp'
          slot-name: 'Production'
          package: 'todo-app.jar'
 
