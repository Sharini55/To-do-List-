<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<title>Smart To-Do App</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --teal:#5dbdbd;--teal-light:#7dd4d4;--teal-dark:#4aa8a8;
  --cream:#f0ede6;--cream2:#e8e4db;
  --text:#1a1a1a;--text-muted:#7a7a7a;
  --red:#e57373;--red-light:#ffb3b3;--purple:#b39ddb;--purple-light:#d1c4e9;
  --overdue:#ff5252;--overdue-bg:#fff5f5;
  --radius:16px;--card-shadow:0 2px 16px rgba(0,0,0,0.08);
  --bottom-nav-height:68px;
}
body{font-family:'DM Sans',sans-serif;background:var(--cream);display:flex;height:100vh;overflow:hidden;color:var(--text);}

/* SIDEBAR & NAV */
#sidebar{width:200px;flex-shrink:0;background:var(--teal);display:flex;flex-direction:column;align-items:center;padding:28px 0 24px;}
.profile-circle{width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,0.3);display:flex;align-items:center;justify-content:center;margin-bottom:28px;cursor:pointer;}
.nav-link{width:100%;text-align:center;padding:14px 16px;font-size:15px;font-weight:500;color:rgba(255,255,255,0.75);cursor:pointer;border:none;background:none;}
.nav-link.active{color:#fff;font-weight:600;}
#main{flex:1;overflow:hidden;display:flex;flex-direction:column;}
.view{display:none;flex:1;overflow:hidden;}
.view.active{display:flex;flex-direction:column;}

/* DASHBOARD STYLES */
.dash-week-bar{background:var(--teal);padding:18px 24px 12px;flex-shrink:0;}
.week-nav{display:flex;align-items:center;gap:16px;color:#fff;}
.week-days{display:flex;overflow-x:auto;gap:10px;margin-top:10px;}
.day-col{min-width:60px;text-align:center;color:#fff;padding:8px;border-radius:12px;cursor:pointer;}
.day-col.selected{background:rgba(255,255,255,0.2);}
.dash-body{padding:24px;overflow-y:auto;flex:1;}

/* CALENDAR STYLES */
.cal-toolbar{display:flex;align-items:center;padding:15px;border-bottom:1px solid #ddd;background:#fff;}
.cal-month-grid-wrap{flex:1;overflow:auto;background:#fff;}
.cal-month-header{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-weight:bold;background:#f9f9f9;padding:10px 0;}
.cal-month-body{display:grid;grid-template-columns:repeat(7,1fr);grid-auto-rows:minmax(100px,1fr);}
.cal-month-cell{border:0.5px solid #eee;padding:5px;cursor:pointer;}
.cal-month-cell:hover{background:#f0f7f7;}
.cal-month-event{background:var(--teal);color:#fff;font-size:10px;padding:2px 4px;border-radius:4px;margin-bottom:2px;}

/* FAB & POPUP */
.fab{position:fixed;bottom:32px;right:32px;width:56px;height:56px;border-radius:50%;background:var(--teal);color:#fff;border:none;font-size:24px;cursor:pointer;box-shadow:0 4px 10px rgba(0,0,0,0.2);z-index:100;}
.add-popup{position:fixed;bottom:100px;right:32px;width:320px;background:#fff;border-radius:20px;padding:20px;box-shadow:0 10px 30px rgba(0,0,0,0.1);display:none;flex-direction:column;gap:10px;z-index:101;}
.add-popup.open{display:flex;}
.add-popup input, .add-popup select{padding:10px;border:1px solid #ddd;border-radius:8px;}
.popup-add-btn{background:var(--teal);color:#fff;border:none;padding:12px;border-radius:8px;cursor:pointer;}

/* MOBILE NAV */
#mobile-nav{display:none;position:fixed;bottom:0;width:100%;height:60px;background:var(--teal);justify-content:space-around;align-items:center;}
@media (max-width:768px){
    #sidebar{display:none;}
    #mobile-nav{display:flex;}
}
</style>
</head>
<body>

<div id="sidebar">
  <div class="profile-circle" onclick="showView('profile')">👤</div>
  <button class="nav-link active" onclick="showView('dashboard')">Dashboard</button>
  <button class="nav-link" onclick="showView('planner')">Planner</button>
  <button class="nav-link" onclick="showView('calendar')">Calendar</button>
  <button class="nav-link" onclick="showView('habits')">Habits</button>
</div>

<div id="main">
  <div id="view-dashboard" class="view active">
    <div class="dash-week-bar">
      <div class="week-nav">
        <button onclick="prevWeek()" style="background:none;border:none;color:#fff;cursor:pointer;">&lt;</button>
        <span id="dash-month-label" class="week-months">Month Year</span>
        <button onclick="nextWeek()" style="background:none;border:none;color:#fff;cursor:pointer;">&gt;</button>
      </div>
      <div id="dash-days-row" class="week-days"></div>
    </div>
    <div id="dash-tasks-container" class="dash-body"></div>
  </div>

  <div id="view-calendar" class="view">
    <div class="cal-toolbar">
      <button onclick="prevMonth()" class="cal-nav-btn">&lt;</button>
      <h2 id="cal-month-title" class="cal-title">Month Year</h2>
      <button onclick="nextMonth()" class="cal-nav-btn">&gt;</button>
    </div>
    <div class="cal-month-grid-wrap">
      <div class="cal-month-header">
        <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
      </div>
      <div id="cal-month-body" class="cal-month-body"></div>
    </div>
  </div>
</div>

<button class="fab" onclick="togglePopup()">+</button>
<div id="add-popup" class="add-popup">
  <h3>New Task</h3>
  <input type="text" id="task-title" placeholder="What needs to be done?">
  <input type="date" id="task-date">
  <select id="task-priority">
    <option value="None">Priority: None</option>
    <option value="Red">High (Red)</option>
    <option value="Yellow">Medium (Yellow)</option>
    <option value="Green">Low (Green)</option>
  </select>
  <button class="popup-add-btn" onclick="addTask()">Add Task</button>
</div>

<script>
let tasks = [];
let selectedDate = new Date();
selectedDate.setHours(0,0,0,0);

// --- DATA PERSISTENCE ---
async function load() {
  try {
    const res = await fetch('/api/appdata');
    const data = await res.json();
    tasks = data.tasks || [];
  } catch(e) { console.error("Load failed", e); }
}

async function save() {
  try {
    await fetch('/api/appdata', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({tasks})
    });
  } catch(e) { console.error("Save failed", e); }
}

// --- NAVIGATION ---
function showView(viewId) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById('view-' + viewId).classList.add('active');
  if(viewId === 'calendar') renderCalendar();
  if(viewId === 'dashboard') renderDashboard();
}

// --- DASHBOARD LOGIC ---
function renderDashboard() {
  const container = document.getElementById('dash-tasks-container');
  const dateStr = selectedDate.toISOString().split('T')[0];
  const dayTasks = tasks.filter(t => t.date === dateStr);
  
  container.innerHTML = dayTasks.length ? '' : '<p>No tasks for this day.</p>';
  dayTasks.forEach(t => {
    const div = document.createElement('div');
    div.className = 'dash-task-item';
    div.innerHTML = `<span>${t.title}</span>`;
    container.appendChild(div);
  });
}

// --- CALENDAR LOGIC ---
let calDate = new Date();
function renderCalendar() {
  const body = document.getElementById('cal-month-body');
  const title = document.getElementById('cal-month-title');
  body.innerHTML = '';
  
  const year = calDate.getFullYear();
  const month = calDate.getMonth();
  title.innerText = calDate.toLocaleString('default', { month: 'long', year: 'numeric' });

  const firstDay = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();

  for(let i=0; i<firstDay; i++) {
    body.innerHTML += '<div class="cal-month-cell other-month"></div>';
  }

  for(let d=1; d<=daysInMonth; d++) {
    const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const dayTasks = tasks.filter(t => t.date === dateStr);
    let taskHtml = dayTasks.map(t => `<div class="cal-month-event">${t.title}</div>`).join('');
    
    body.innerHTML += `
      <div class="cal-month-cell">
        <div class="cal-cell-num">${d}</div>
        ${taskHtml}
      </div>`;
  }
}

function prevMonth() { calDate.setMonth(calDate.getMonth() - 1); renderCalendar(); }
function nextMonth() { calDate.setMonth(calDate.getMonth() + 1); renderCalendar(); }

// --- TASK LOGIC ---
function togglePopup() { document.getElementById('add-popup').classList.toggle('open'); }

async function addTask() {
  const title = document.getElementById('task-title').value;
  const date = document.getElementById('task-date').value;
  if(!title || !date) return alert("Please fill title and date");

  tasks.push({ title, date, id: Date.now() });
  await save();
  togglePopup();
  renderDashboard();
  renderCalendar();
}

// --- INIT ---
(async function() {
  await load();
  renderDashboard();
})();
</script>

</body>
</html>
