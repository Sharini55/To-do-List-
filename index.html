<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Smart To-Do App</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet"/>
<style>
/* ── RESET & BASE ── */
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --teal:#5dbdbd;
  --teal-light:#7dd4d4;
  --teal-dark:#4aa8a8;
  --cream:#f0ede6;
  --cream2:#e8e4db;
  --white:#ffffff;
  --text:#1a1a1a;
  --text-muted:#7a7a7a;
  --red:#e57373;
  --red-light:#ffb3b3;
  --purple:#b39ddb;
  --purple-light:#d1c4e9;
  --radius:16px;
  --card-shadow:0 2px 16px rgba(0,0,0,0.08);
}
body{font-family:'DM Sans',sans-serif;background:var(--cream);display:flex;height:100vh;overflow:hidden;color:var(--text);}

/* ── SIDEBAR ── */
#sidebar{
  width:200px;flex-shrink:0;background:var(--teal);
  display:flex;flex-direction:column;align-items:center;
  padding:28px 0 24px;gap:0;position:relative;
}
.profile-circle{
  width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,0.3);
  display:flex;align-items:center;justify-content:center;margin-bottom:28px;
}
.profile-circle svg{opacity:.8;}
.nav-link{
  width:100%;text-align:center;padding:14px 16px;font-size:15px;font-weight:500;
  color:rgba(255,255,255,0.75);cursor:pointer;border:none;background:none;
  transition:color .2s;letter-spacing:.01em;
}
.nav-link:hover{color:#fff;}
.nav-link.active{color:#fff;font-weight:600;}
.nav-link.active-orange{color:#f4a76a!important;font-weight:600;}

/* ── MAIN ── */
#main{flex:1;overflow:hidden;display:flex;flex-direction:column;}

/* ── VIEWS ── */
.view{display:none;flex:1;overflow:hidden;}
.view.active{display:flex;flex-direction:column;}

/* ═══════════════════════════════
   DASHBOARD VIEW
═══════════════════════════════ */
#view-dashboard{background:var(--cream);}
.dash-week-bar{
  background:var(--teal);padding:18px 24px 0;flex-shrink:0;
}
.week-nav{display:flex;align-items:center;gap:16px;margin-bottom:14px;}
.week-nav button{background:none;border:none;color:#fff;font-size:20px;cursor:pointer;padding:2px 6px;}
.week-months{display:flex;gap:32px;font-family:'Playfair Display',serif;font-size:17px;color:#fff;font-weight:600;}
.week-days{display:flex;gap:0;overflow-x:auto;padding-bottom:12px;}
.week-days::-webkit-scrollbar{display:none;}
.day-col{
  min-width:80px;text-align:center;cursor:pointer;padding:6px 0 10px;
  border-radius:12px 12px 0 0;color:rgba(255,255,255,0.75);transition:background .2s;
}
.day-col:hover{background:rgba(255,255,255,0.15);}
.day-col.today{background:rgba(255,255,255,0.15);}
.day-col .day-letter{font-size:13px;font-weight:500;margin-bottom:4px;}
.day-col .day-num{
  font-size:22px;font-weight:600;color:#fff;width:38px;height:38px;border-radius:50%;
  display:inline-flex;align-items:center;justify-content:center;
}
.day-col.selected .day-num{background:rgba(255,255,255,0.25);}

.dash-body{
  flex:1;overflow-y:auto;padding:24px 28px;display:flex;gap:24px;
}
.dash-left{flex:1;display:flex;flex-direction:column;gap:16px;}
.dash-task-item{
  display:flex;align-items:center;gap:14px;font-size:16px;cursor:pointer;padding:4px 0;
}
.dash-task-circle{
  width:22px;height:22px;border-radius:50%;border:2px solid var(--teal);flex-shrink:0;
  transition:background .2s,border-color .2s;
}
.dash-task-item.done .dash-task-circle{background:var(--teal-dark);border-color:var(--teal-dark);}
.dash-task-item.done .dash-task-text{text-decoration:line-through;color:var(--text-muted);}
.dash-task-text{font-size:16px;flex:1;}

.dash-task-item:hover .dash-task-text{color:var(--teal-dark);}

/* Add task popup (floating) */
.fab{
  position:fixed;bottom:32px;right:32px;width:52px;height:52px;border-radius:50%;
  background:var(--teal);border:none;cursor:pointer;font-size:28px;color:#fff;
  box-shadow:0 4px 20px rgba(93,189,189,.5);transition:transform .2s,box-shadow .2s;
  display:flex;align-items:center;justify-content:center;z-index:100;
}
.fab:hover{transform:scale(1.1);box-shadow:0 6px 24px rgba(93,189,189,.6);}

.add-popup{
  position:fixed;bottom:100px;right:32px;width:340px;
  background:var(--teal);border-radius:20px;padding:20px;
  box-shadow:0 8px 40px rgba(0,0,0,.18);z-index:99;
  display:none;flex-direction:column;gap:12px;
}
.add-popup.open{display:flex;}
.add-popup input,.add-popup select{
  border:none;border-radius:10px;padding:12px 16px;font-size:14px;
  font-family:'DM Sans',sans-serif;background:#fff;width:100%;outline:none;color:var(--text);
}
.popup-row{display:flex;gap:10px;}
.popup-row input,.popup-row select{flex:1;}
.popup-date-row{
  display:flex;align-items:center;background:#fff;border-radius:10px;padding:10px 14px;gap:10px;
}
.popup-date-row span{font-size:20px;}
.popup-date-row input{border:none;outline:none;font-size:14px;font-family:'DM Sans',sans-serif;flex:1;}
.popup-add-btn{
  background:#fff;color:var(--teal-dark);border:none;border-radius:10px;padding:12px;
  font-size:15px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;
  transition:background .2s;
}
.popup-add-btn:hover{background:var(--cream);}

/* ═══════════════════════════════
   DAILY PLANNER VIEW
═══════════════════════════════ */
#view-planner{background:var(--cream);flex-direction:row!important;}
.planner-main{flex:1;overflow-y:auto;padding:24px 20px;display:flex;flex-direction:column;gap:16px;}
.planner-right{width:280px;flex-shrink:0;background:var(--teal);padding:20px;overflow-y:auto;}
.planner-right h3{font-family:'Playfair Display',serif;font-size:22px;color:#fff;margin-bottom:16px;text-align:center;}

.planner-card{
  background:var(--teal);border-radius:var(--radius);padding:20px;
}
.planner-card-header{
  background:#fff;border-radius:10px;padding:10px 18px;text-align:center;
  font-family:'Playfair Display',serif;font-size:18px;color:var(--text);margin-bottom:16px;
}

/* Priority tasks in planner */
.priority-bullet{display:flex;align-items:center;gap:12px;margin:10px 0;}
.priority-dot{width:14px;height:14px;border-radius:50%;background:#2a2a2a;flex-shrink:0;}
.priority-dot.red{background:var(--red);}
.priority-dot.yellow{background:#f4c769;}
.priority-dot.green{background:#81c784;}
.priority-label{font-size:16px;color:#fff;}

/* Reminders panel */
.reminder-item{
  display:flex;align-items:center;gap:10px;background:rgba(255,255,255,0.2);
  border-radius:10px;padding:10px 14px;margin:8px 0;color:#fff;font-size:14px;
}
.reminder-item .rem-time{font-weight:600;font-size:13px;opacity:.8;}

/* Goals panel */
.goal-bar{
  border-radius:10px;padding:12px 18px;margin:8px 0;
  font-size:16px;color:#fff;font-weight:500;cursor:pointer;
  background:linear-gradient(to right,var(--red-light),var(--red));
}
.goal-bar.purple{background:linear-gradient(to right,var(--purple-light),var(--purple));}
.goal-progress{height:6px;background:rgba(255,255,255,0.4);border-radius:3px;margin-top:8px;}
.goal-fill{height:100%;border-radius:3px;background:#fff;}

/* Timeline (right side of planner) */
.timeline-slot{
  display:flex;align-items:flex-start;gap:10px;min-height:44px;
  border-bottom:1px solid rgba(255,255,255,0.2);padding:4px 0;
}
.timeline-time{font-size:12px;color:rgba(255,255,255,0.8);width:40px;flex-shrink:0;padding-top:4px;font-weight:500;}
.timeline-event{
  flex:1;background:#fff;border-radius:8px;padding:5px 10px;
  font-size:13px;color:var(--text);cursor:grab;min-height:32px;
  display:flex;align-items:center;
}
.timeline-event:empty{background:transparent;cursor:default;}
.timeline-empty{flex:1;min-height:32px;border-radius:8px;transition:background .15s;}
.timeline-slot.drag-over .timeline-empty{background:rgba(255,255,255,0.25);}

/* ═══════════════════════════════
   CALENDAR VIEW
═══════════════════════════════ */
#view-calendar{background:var(--cream);overflow-y:auto;padding:28px;}
.cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;}
.cal-header h2{font-family:'Playfair Display',serif;font-size:28px;}
.cal-nav{display:flex;gap:10px;}
.cal-nav button{background:var(--teal);border:none;color:#fff;width:36px;height:36px;border-radius:50%;cursor:pointer;font-size:18px;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;}
.cal-day-name{text-align:center;font-size:13px;font-weight:600;color:var(--text-muted);padding:6px 0;}
.cal-day{
  min-height:80px;background:#fff;border-radius:12px;padding:8px;cursor:pointer;
  transition:background .15s;position:relative;
}
.cal-day:hover{background:var(--cream2);}
.cal-day.today{border:2px solid var(--teal);}
.cal-day.other-month{opacity:.4;}
.cal-day-num{font-size:13px;font-weight:600;margin-bottom:4px;}
.cal-task-dot{
  font-size:11px;background:var(--teal);color:#fff;border-radius:4px;
  padding:1px 5px;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}

/* ═══════════════════════════════
   REMINDERS VIEW
═══════════════════════════════ */
#view-reminders{background:var(--cream);overflow-y:auto;padding:28px;}
#view-reminders h2{font-family:'Playfair Display',serif;font-size:28px;margin-bottom:24px;}
.reminder-card{
  background:#fff;border-radius:var(--radius);padding:20px;margin-bottom:14px;
  display:flex;align-items:center;gap:16px;box-shadow:var(--card-shadow);
}
.reminder-card .rem-icon{font-size:28px;}
.reminder-card .rem-info .rem-title{font-size:16px;font-weight:600;}
.reminder-card .rem-info .rem-dt{font-size:13px;color:var(--text-muted);margin-top:3px;}
.rem-delete{margin-left:auto;background:none;border:none;font-size:20px;cursor:pointer;color:#ccc;transition:color .2s;}
.rem-delete:hover{color:var(--red);}
.add-rem-form{
  background:var(--teal);border-radius:var(--radius);padding:20px;
  display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin-bottom:24px;
}
.add-rem-form input,.add-rem-form select{
  border:none;border-radius:10px;padding:11px 14px;font-size:14px;
  font-family:'DM Sans',sans-serif;flex:1;min-width:140px;outline:none;
}
.add-rem-form button{
  background:#fff;color:var(--teal-dark);border:none;border-radius:10px;
  padding:11px 22px;font-size:14px;font-weight:600;cursor:pointer;
  font-family:'DM Sans',sans-serif;
}

/* ═══════════════════════════════
   HABIT TRACKER VIEW
═══════════════════════════════ */
#view-habits{background:var(--cream);overflow-y:auto;padding:28px;}
#view-habits h2{font-family:'Playfair Display',serif;font-size:28px;margin-bottom:8px;}
#view-habits p.subtitle{color:var(--text-muted);font-size:14px;margin-bottom:24px;}
.habit-card{
  background:#fff;border-radius:var(--radius);padding:20px;margin-bottom:14px;
  box-shadow:var(--card-shadow);
}
.habit-card-top{display:flex;align-items:center;gap:14px;margin-bottom:12px;}
.habit-icon{font-size:24px;}
.habit-name{font-size:17px;font-weight:600;flex:1;}
.habit-streak{background:var(--teal);color:#fff;border-radius:20px;padding:3px 12px;font-size:13px;font-weight:600;}
.habit-week{display:flex;gap:6px;}
.habit-day-box{
  flex:1;height:36px;border-radius:8px;background:var(--cream2);cursor:pointer;
  display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--text-muted);
  transition:background .2s;font-weight:500;
}
.habit-day-box.done{background:var(--teal);color:#fff;}
.add-habit-form{
  background:var(--teal);border-radius:var(--radius);padding:18px;
  display:flex;gap:10px;align-items:center;margin-bottom:24px;
}
.add-habit-form input{
  flex:1;border:none;border-radius:10px;padding:11px 14px;font-size:14px;
  font-family:'DM Sans',sans-serif;outline:none;
}
.add-habit-form select{
  border:none;border-radius:10px;padding:11px 12px;font-size:14px;
  font-family:'DM Sans',sans-serif;outline:none;
}
.add-habit-form button{
  background:#fff;color:var(--teal-dark);border:none;border-radius:10px;
  padding:11px 18px;font-size:14px;font-weight:600;cursor:pointer;
  font-family:'DM Sans',sans-serif;white-space:nowrap;
}

/* ── EDIT MODAL ── */
.modal-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:200;
  display:none;align-items:center;justify-content:center;
}
.modal-overlay.open{display:flex;}
.modal{
  background:#fff;border-radius:20px;padding:28px;width:380px;max-width:95vw;
  box-shadow:0 12px 60px rgba(0,0,0,.2);
}
.modal h3{font-family:'Playfair Display',serif;font-size:22px;margin-bottom:18px;}
.modal input,.modal select,.modal textarea{
  width:100%;border:1.5px solid #e0e0e0;border-radius:10px;padding:11px 14px;
  font-size:14px;font-family:'DM Sans',sans-serif;outline:none;margin-bottom:12px;
  transition:border-color .2s;
}
.modal input:focus,.modal select:focus,.modal textarea:focus{border-color:var(--teal);}
.modal-btns{display:flex;gap:10px;margin-top:4px;}
.modal-btns button{flex:1;padding:11px;border-radius:10px;border:none;cursor:pointer;font-size:14px;font-weight:600;font-family:'DM Sans',sans-serif;}
.btn-save{background:var(--teal);color:#fff;}
.btn-cancel{background:var(--cream2);color:var(--text);}
.btn-delete{background:#ffebee;color:var(--red);}
</style>
</head>
<body>

<!-- ── SIDEBAR ── -->
<nav id="sidebar">
  <div class="profile-circle">
    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.5">
      <circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
    </svg>
  </div>
  <button class="nav-link active" onclick="showView('dashboard',this)">Dashboard</button>
  <button class="nav-link" onclick="showView('planner',this)">Daily Planner</button>
  <button class="nav-link" onclick="showView('calendar',this)">Calendar</button>
  <button class="nav-link" onclick="showView('reminders',this)">Reminders</button>
  <button class="nav-link" onclick="showView('habits',this)">Habit Tracker</button>
</nav>

<!-- ══════════════ MAIN ══════════════ -->
<div id="main">

  <!-- ══ DASHBOARD ══ -->
  <div id="view-dashboard" class="view active">
    <!-- Week bar -->
    <div class="dash-week-bar">
      <div class="week-nav">
        <button onclick="shiftWeek(-1)">◀</button>
        <div class="week-months" id="week-months-label"></div>
        <button onclick="shiftWeek(1)" style="margin-left:auto">▶</button>
      </div>
      <div class="week-days" id="week-days"></div>
    </div>
    <!-- Tasks for selected day -->
    <div class="dash-body">
      <div class="dash-left">
        <div id="dash-task-list" style="display:flex;flex-direction:column;gap:4px;">
          <p style="color:var(--text-muted);font-size:15px;">No tasks for this day.</p>
        </div>
      </div>
    </div>
  </div>

  <!-- ══ DAILY PLANNER ══ -->
  <div id="view-planner" class="view">
    <div class="planner-main">

      <!-- Top Priority Tasks -->
      <div class="planner-card">
        <div class="planner-card-header">Top priority tasks</div>
        <div id="planner-priority-list">
          <p style="color:rgba(255,255,255,.6);font-size:14px;">No high-priority tasks yet.</p>
        </div>
      </div>

      <!-- Reminders panel -->
      <div class="planner-card">
        <div class="planner-card-header">Reminders</div>
        <div id="planner-reminders-list">
          <p style="color:rgba(255,255,255,.6);font-size:14px;">No reminders yet. Add them in the Reminders tab.</p>
        </div>
      </div>

      <!-- Goals -->
      <div class="planner-card">
        <div class="planner-card-header">Goals</div>
        <div id="planner-goals-list">
          <p style="color:rgba(255,255,255,.6);font-size:14px;">No habits tracked yet.</p>
        </div>
      </div>

    </div>

    <!-- Right: Timeline -->
    <div class="planner-right">
      <h3>Calendar</h3>
      <div id="planner-timeline"></div>
    </div>
  </div>

  <!-- ══ CALENDAR ══ -->
  <div id="view-calendar" class="view">
    <div class="cal-header">
      <h2 id="cal-month-label"></h2>
      <div class="cal-nav">
        <button onclick="shiftMonth(-1)">‹</button>
        <button onclick="shiftMonth(1)">›</button>
      </div>
    </div>
    <div class="cal-grid" id="cal-grid"></div>
  </div>

  <!-- ══ REMINDERS ══ -->
  <div id="view-reminders" class="view">
    <h2>⏰ Reminders</h2>
    <div class="add-rem-form">
      <input id="rem-title" placeholder="Reminder title"/>
      <input id="rem-datetime" type="datetime-local"/>
      <button onclick="addReminder()">+ Add</button>
    </div>
    <div id="reminders-list"></div>
  </div>

  <!-- ══ HABIT TRACKER ══ -->
  <div id="view-habits" class="view">
    <h2>🌱 Habit Tracker</h2>
    <p class="subtitle">Track your daily habits. Each completed habit counts toward your goals.</p>
    <div class="add-habit-form">
      <input id="habit-name" placeholder="New habit (e.g. Exercise, Read...)"/>
      <select id="habit-icon">
        <option value="💪">💪 Exercise</option>
        <option value="📚">📚 Read</option>
        <option value="💧">💧 Drink Water</option>
        <option value="🧘">🧘 Meditate</option>
        <option value="✍️">✍️ Journal</option>
        <option value="🌙">🌙 Sleep Early</option>
        <option value="⭐">⭐ Custom</option>
      </select>
      <button onclick="addHabit()">+ Add Habit</button>
    </div>
    <div id="habits-list"></div>
  </div>

</div><!-- /#main -->

<!-- ── FAB + POPUP (Dashboard only) ── -->
<button class="fab" id="fab-btn" onclick="togglePopup()">+</button>
<div class="add-popup" id="add-popup">
  <input id="pop-title" placeholder="Enter the task *"/>
  <div class="popup-row">
    <select id="pop-priority">
      <option value="None">Priority</option>
      <option value="Red">🔴 High</option>
      <option value="Yellow">🟡 Medium</option>
      <option value="Green">🟢 Low</option>
    </select>
    <select id="pop-reminder-link">
      <option value="">Reminder</option>
    </select>
  </div>
  <div class="popup-date-row">
    <span>📅</span>
    <input id="pop-date" type="date"/>
  </div>
  <button class="popup-add-btn" onclick="addTaskFromPopup()">Add Task</button>
</div>

<!-- ── EDIT MODAL ── -->
<div class="modal-overlay" id="edit-modal">
  <div class="modal">
    <h3>Edit Task</h3>
    <input id="edit-title" placeholder="Task title"/>
    <input id="edit-date" type="date"/>
    <select id="edit-priority">
      <option value="None">No Priority</option>
      <option value="Red">🔴 High Priority</option>
      <option value="Yellow">🟡 Medium Priority</option>
      <option value="Green">🟢 Low Priority</option>
    </select>
    <textarea id="edit-desc" rows="2" placeholder="Notes (optional)" style="resize:none;"></textarea>
    <div class="modal-btns">
      <button class="btn-save" onclick="saveEdit()">Save</button>
      <button class="btn-delete" onclick="deleteEditTask()">Delete</button>
      <button class="btn-cancel" onclick="closeModal()">Cancel</button>
    </div>
  </div>
</div>

<script>
// ═══════════════════════════════════════════
//  STATE
// ═══════════════════════════════════════════
let tasks = [];
let reminders = [];
let habits = [];
let timelineEvents = {}; // { "HH:MM": "event title" }
let selectedDate = new Date();
let weekOffset = 0;
let calMonth = new Date();
let editingTaskId = null;
let nextId = 1;

const DAYS = ['S','M','T','W','T','F','S'];
const DAY_NAMES = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];

// ═══════════════════════════════════════════
//  NAVIGATION
// ═══════════════════════════════════════════
function showView(name, btn) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.querySelectorAll('.nav-link').forEach(b => { b.classList.remove('active','active-orange'); });
  document.getElementById('view-' + name).classList.add('active');
  if (btn) {
    btn.classList.add(name === 'planner' ? 'active-orange' : 'active');
  }
  // Show/hide FAB
  document.getElementById('fab-btn').style.display = name === 'dashboard' ? 'flex' : 'none';
  document.getElementById('add-popup').classList.remove('open');

  if (name === 'dashboard') renderDashboard();
  if (name === 'planner') renderPlanner();
  if (name === 'calendar') renderCalendar();
  if (name === 'reminders') renderReminders();
  if (name === 'habits') renderHabits();
}

// ═══════════════════════════════════════════
//  TASK MANAGEMENT
// ═══════════════════════════════════════════
function addTaskFromPopup() {
  const title = document.getElementById('pop-title').value.trim();
  if (!title) { alert('Please enter a task title.'); return; }
  const dateVal = document.getElementById('pop-date').value;
  tasks.push({
    id: nextId++,
    title,
    description: '',
    priority: document.getElementById('pop-priority').value,
    dueDate: dateVal || toDateStr(selectedDate),
    completed: false
  });
  document.getElementById('pop-title').value = '';
  document.getElementById('pop-priority').value = 'None';
  document.getElementById('pop-date').value = '';
  togglePopup();
  renderDashboard();
  saveToBrowser();
}

function toggleTask(id) {
  const t = tasks.find(t => t.id === id);
  if (t) { t.completed = !t.completed; renderDashboard(); saveToBrowser(); }
}

function openEdit(id) {
  const t = tasks.find(t => t.id === id);
  if (!t) return;
  editingTaskId = id;
  document.getElementById('edit-title').value = t.title;
  document.getElementById('edit-date').value = t.dueDate || '';
  document.getElementById('edit-priority').value = t.priority || 'None';
  document.getElementById('edit-desc').value = t.description || '';
  document.getElementById('edit-modal').classList.add('open');
}
function saveEdit() {
  const t = tasks.find(t => t.id === editingTaskId);
  if (!t) return;
  t.title = document.getElementById('edit-title').value.trim() || t.title;
  t.dueDate = document.getElementById('edit-date').value;
  t.priority = document.getElementById('edit-priority').value;
  t.description = document.getElementById('edit-desc').value;
  closeModal(); renderDashboard(); renderPlanner(); saveToBrowser();
}
function deleteEditTask() {
  tasks = tasks.filter(t => t.id !== editingTaskId);
  closeModal(); renderDashboard(); renderPlanner(); saveToBrowser();
}
function closeModal() {
  document.getElementById('edit-modal').classList.remove('open');
  editingTaskId = null;
}

// ═══════════════════════════════════════════
//  DASHBOARD + WEEK
// ═══════════════════════════════════════════
function getWeekDates() {
  const today = new Date();
  today.setHours(0,0,0,0);
  const base = new Date(today);
  base.setDate(base.getDate() + weekOffset * 7);
  // Start from Monday
  const dow = base.getDay();
  const monday = new Date(base);
  monday.setDate(base.getDate() - (dow === 0 ? 6 : dow - 1));
  return Array.from({length:8}, (_,i) => { const d = new Date(monday); d.setDate(monday.getDate()+i); return d; });
}

function shiftWeek(dir) {
  weekOffset += dir;
  renderDashboard();
}

function renderDashboard() {
  renderWeekBar();
  renderDayTasks();
}

function renderWeekBar() {
  const dates = getWeekDates();
  const today = toDateStr(new Date());
  const selStr = toDateStr(selectedDate);

  // Month labels
  const months = [...new Set(dates.map(d => MONTHS[d.getMonth()]))];
  document.getElementById('week-months-label').innerHTML =
    dates.map(d => `<span>${MONTHS[d.getMonth()]} ${d.getFullYear()}</span>`).filter((v,i,a)=>a.indexOf(v)===i).join('&nbsp;&nbsp;');

  const container = document.getElementById('week-days');
  container.innerHTML = '';
  dates.forEach(d => {
    const dstr = toDateStr(d);
    const isToday = dstr === today;
    const isSel = dstr === selStr;
    const col = document.createElement('div');
    col.className = 'day-col' + (isToday ? ' today' : '') + (isSel ? ' selected' : '');
    col.innerHTML = `<div class="day-letter">${DAY_NAMES[d.getDay()]}</div><div class="day-num">${d.getDate()}</div>`;
    col.onclick = () => { selectedDate = new Date(d); renderDashboard(); };
    container.appendChild(col);
  });
}

function renderDayTasks() {
  const selStr = toDateStr(selectedDate);
  const dayTasks = tasks.filter(t => t.dueDate === selStr);
  const container = document.getElementById('dash-task-list');
  if (dayTasks.length === 0) {
    container.innerHTML = '<p style="color:var(--text-muted);font-size:15px;padding:8px 0;">No tasks for this day.</p>';
    return;
  }
  container.innerHTML = dayTasks.map(t => `
    <div class="dash-task-item ${t.completed ? 'done' : ''}" style="padding:6px 0;">
      <div class="dash-task-circle" onclick="toggleTask(${t.id})"></div>
      <span class="dash-task-text" onclick="openEdit(${t.id})">${esc(t.title)}</span>
      ${t.priority && t.priority !== 'None' ? `<span style="font-size:11px;background:${prioColor(t.priority)};color:#fff;border-radius:6px;padding:2px 8px;">${t.priority}</span>` : ''}
    </div>
  `).join('');
}

// ═══════════════════════════════════════════
//  DAILY PLANNER
// ═══════════════════════════════════════════
function renderPlanner() {
  // Priority tasks
  const highPrio = tasks.filter(t => (t.priority === 'Red' || t.priority === 'Yellow') && !t.completed);
  const pl = document.getElementById('planner-priority-list');
  pl.innerHTML = highPrio.length
    ? highPrio.map(t => `
        <div class="priority-bullet">
          <div class="priority-dot ${t.priority === 'Red' ? 'red' : 'yellow'}"></div>
          <span class="priority-label">${esc(t.title)}</span>
        </div>`).join('')
    : '<p style="color:rgba(255,255,255,.6);font-size:14px;">No high-priority tasks.</p>';

  // Reminders
  const rl = document.getElementById('planner-reminders-list');
  rl.innerHTML = reminders.length
    ? reminders.map(r => `
        <div class="reminder-item">
          <span>⏰</span>
          <div>
            <div style="font-weight:600;">${esc(r.title)}</div>
            <div class="rem-time">${formatDT(r.datetime)}</div>
          </div>
        </div>`).join('')
    : '<p style="color:rgba(255,255,255,.6);font-size:14px;">No reminders. Add in Reminders tab.</p>';

  // Goals (from habits)
  const gl = document.getElementById('planner-goals-list');
  gl.innerHTML = habits.length
    ? habits.map(h => {
        const done = h.week.filter(Boolean).length;
        const pct = Math.round(done / 7 * 100);
        const cls = ['red','yellow','green','purple'][habits.indexOf(h) % 4] || '';
        return `<div class="goal-bar ${cls === 'purple' ? 'purple' : ''}">
          ${h.icon} ${esc(h.name)}
          <div class="goal-progress"><div class="goal-fill" style="width:${pct}%"></div></div>
        </div>`;
      }).join('')
    : '<p style="color:rgba(255,255,255,.6);font-size:14px;">No habits tracked yet. Add in Habit Tracker tab.</p>';

  // Timeline
  renderTimeline();
}

function renderTimeline() {
  const times = [];
  for (let h = 9; h <= 21; h++) {
    ['00','30'].forEach(m => times.push(`${String(h).padStart(2,'0')}:${m}`));
  }
  const container = document.getElementById('planner-timeline');
  container.innerHTML = '';
  times.forEach(t => {
    const slot = document.createElement('div');
    slot.className = 'timeline-slot';
    slot.dataset.time = t;
    const ev = timelineEvents[t];
    slot.innerHTML = `
      <span class="timeline-time">${fmtTime(t)}</span>
      ${ev
        ? `<div class="timeline-event" draggable="true" ondragstart="dragEvent('${t}')">${esc(ev)} <span onclick="removeEvent('${t}')" style="margin-left:auto;cursor:pointer;color:#aaa;font-size:11px;">✕</span></div>`
        : `<div class="timeline-empty" onclick="promptEvent('${t}')"></div>`}
    `;
    slot.addEventListener('dragover', e => { e.preventDefault(); slot.classList.add('drag-over'); });
    slot.addEventListener('dragleave', () => slot.classList.remove('drag-over'));
    slot.addEventListener('drop', e => { e.preventDefault(); slot.classList.remove('drag-over'); dropEvent(t); });
    container.appendChild(slot);
  });
}

let draggingTime = null;
function dragEvent(time) { draggingTime = time; }
function dropEvent(targetTime) {
  if (!draggingTime || draggingTime === targetTime) return;
  timelineEvents[targetTime] = timelineEvents[draggingTime];
  delete timelineEvents[draggingTime];
  draggingTime = null;
  renderTimeline();
}
function promptEvent(time) {
  const title = prompt(`Add event at ${fmtTime(time)}:`);
  if (title && title.trim()) { timelineEvents[time] = title.trim(); renderTimeline(); }
}
function removeEvent(time) { delete timelineEvents[time]; renderTimeline(); }

// ═══════════════════════════════════════════
//  CALENDAR
// ═══════════════════════════════════════════
function shiftMonth(dir) { calMonth.setMonth(calMonth.getMonth() + dir); renderCalendar(); }

function renderCalendar() {
  document.getElementById('cal-month-label').textContent = `${MONTHS[calMonth.getMonth()]} ${calMonth.getFullYear()}`;
  const grid = document.getElementById('cal-grid');
  grid.innerHTML = '';
  ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].forEach(d => {
    const el = document.createElement('div');
    el.className = 'cal-day-name';
    el.textContent = d;
    grid.appendChild(el);
  });
  const first = new Date(calMonth.getFullYear(), calMonth.getMonth(), 1);
  const last = new Date(calMonth.getFullYear(), calMonth.getMonth() + 1, 0);
  const todayStr = toDateStr(new Date());
  // Blank cells
  for (let i = 0; i < first.getDay(); i++) {
    const el = document.createElement('div');
    el.className = 'cal-day other-month';
    grid.appendChild(el);
  }
  for (let d = 1; d <= last.getDate(); d++) {
    const date = new Date(calMonth.getFullYear(), calMonth.getMonth(), d);
    const dstr = toDateStr(date);
    const dayTasks = tasks.filter(t => t.dueDate === dstr);
    const el = document.createElement('div');
    el.className = 'cal-day' + (dstr === todayStr ? ' today' : '');
    el.innerHTML = `<div class="cal-day-num">${d}</div>` +
      dayTasks.slice(0,3).map(t => `<div class="cal-task-dot">${esc(t.title)}</div>`).join('');
    el.onclick = () => {
      selectedDate = date;
      showView('dashboard', document.querySelector('.nav-link'));
    };
    grid.appendChild(el);
  }
}

// ═══════════════════════════════════════════
//  REMINDERS
// ═══════════════════════════════════════════
function addReminder() {
  const title = document.getElementById('rem-title').value.trim();
  const dt = document.getElementById('rem-datetime').value;
  if (!title || !dt) { alert('Please fill in title and date/time.'); return; }
  reminders.push({ id: nextId++, title, datetime: dt });
  document.getElementById('rem-title').value = '';
  document.getElementById('rem-datetime').value = '';
  renderReminders();
  saveToBrowser();
}
function deleteReminder(id) {
  reminders = reminders.filter(r => r.id !== id);
  renderReminders();
  saveToBrowser();
}
function renderReminders() {
  const container = document.getElementById('reminders-list');
  if (!reminders.length) {
    container.innerHTML = '<p style="color:var(--text-muted);text-align:center;padding:40px;">No reminders yet.</p>';
    return;
  }
  container.innerHTML = reminders.map(r => `
    <div class="reminder-card">
      <div class="rem-icon">⏰</div>
      <div class="rem-info">
        <div class="rem-title">${esc(r.title)}</div>
        <div class="rem-dt">${formatDT(r.datetime)}</div>
      </div>
      <button class="rem-delete" onclick="deleteReminder(${r.id})">✕</button>
    </div>
  `).join('');
}

// ═══════════════════════════════════════════
//  HABIT TRACKER
// ═══════════════════════════════════════════
const WEEK_LABELS = ['M','T','W','T','F','S','S'];
function addHabit() {
  const name = document.getElementById('habit-name').value.trim();
  if (!name) { alert('Enter a habit name.'); return; }
  const icon = document.getElementById('habit-icon').value;
  habits.push({ id: nextId++, name, icon, week: [false,false,false,false,false,false,false], streak: 0 });
  document.getElementById('habit-name').value = '';
  renderHabits();
  saveToBrowser();
}
function toggleHabitDay(id, idx) {
  const h = habits.find(h => h.id === id);
  if (!h) return;
  h.week[idx] = !h.week[idx];
  h.streak = h.week.filter(Boolean).length;
  renderHabits();
  renderPlanner();
  saveToBrowser();
}
function renderHabits() {
  const container = document.getElementById('habits-list');
  if (!habits.length) {
    container.innerHTML = '<p style="color:var(--text-muted);text-align:center;padding:40px;">No habits yet. Add your first one above!</p>';
    return;
  }
  container.innerHTML = habits.map(h => `
    <div class="habit-card">
      <div class="habit-card-top">
        <span class="habit-icon">${h.icon}</span>
        <span class="habit-name">${esc(h.name)}</span>
        <span class="habit-streak">🔥 ${h.streak} day${h.streak !== 1 ? 's' : ''}</span>
      </div>
      <div class="habit-week">
        ${WEEK_LABELS.map((l,i) => `
          <div class="habit-day-box ${h.week[i] ? 'done' : ''}" onclick="toggleHabitDay(${h.id},${i})">${l}</div>
        `).join('')}
      </div>
    </div>
  `).join('');
}

// ═══════════════════════════════════════════
//  POPUP
// ═══════════════════════════════════════════
function togglePopup() {
  const p = document.getElementById('add-popup');
  p.classList.toggle('open');
  // Pre-fill date with selected day
  if (p.classList.contains('open')) {
    document.getElementById('pop-date').value = toDateStr(selectedDate);
  }
}
document.addEventListener('click', e => {
  const popup = document.getElementById('add-popup');
  const fab = document.getElementById('fab-btn');
  if (popup.classList.contains('open') && !popup.contains(e.target) && e.target !== fab) {
    popup.classList.remove('open');
  }
});

// ═══════════════════════════════════════════
//  HELPERS
// ═══════════════════════════════════════════
function toDateStr(d) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function esc(s) {
  return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function prioColor(p) {
  return p === 'Red' ? '#e57373' : p === 'Yellow' ? '#c8a400' : '#81c784';
}
function formatDT(dt) {
  if (!dt) return '';
  const d = new Date(dt);
  return d.toLocaleString('en-US', {month:'short',day:'numeric',year:'numeric',hour:'numeric',minute:'2-digit'});
}
function fmtTime(t) {
  const [h,m] = t.split(':').map(Number);
  const ampm = h >= 12 ? 'PM' : 'AM';
  const hh = h > 12 ? h - 12 : h === 0 ? 12 : h;
  return `${hh}:${String(m).padStart(2,'0')}`;
}

  // No localStorage in claude.ai artifacts; state lives in memory per session
}

// ═══════════════════════════════════════════
//  API SYNC (Spring Boot backend)
// ═══════════════════════════════════════════
async function syncWithBackend() {
  try {
    const res = await fetch('/api/tasks');
    if (res.ok) {
      const backendTasks = await res.json();
      if (backendTasks.length) tasks = backendTasks;
    }
  } catch(e) { /* Running locally without backend is fine */ }
}

// ═══════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════
(async function init() {
  selectedDate = new Date();
  selectedDate.setHours(0,0,0,0);

  // Seed some demo timeline events
  timelineEvents['09:00'] = 'IEE class';
  timelineEvents['11:00'] = 'Calc class';
  timelineEvents['12:00'] = 'Lunch';

  await syncWithBackend();
  renderDashboard();
})();
</script>
